name: Main-Branch-Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual triggering
    inputs:
      release-powerplatform-solution:
        required: false
        type: boolean
        default: false
        description: 'Release Power Platform solution'
      release-azure-infrastructure:
        required: false
        type: boolean
        default: false
        description: 'Release Azure infrastructure'
      release-azure-code:
        required: false
        type: boolean
        default: false
        description: 'Release Azure code'     
        
permissions:
  contents: read  # Allows reading repository contents
  checks: write  # Allows writing test reports
  pull-requests: write  # Allows reporting results on PRs

env:
  TERRAFORM_VERSION: &terraform_version '1.10.5'
  TERRAFORM_WORKING_DIRECTORY: &terraform_working_directory 'config/azure-templates'

jobs:
  build:
    name: Build and test
    uses: ./.github/workflows/_template-build.yml
    secrets: inherit
    with:
      node-version: '24'
      run-tests: true
      artifacts-build-upload: true
      run-sonar-analysis: true

  # Additional job that extends the base build
  deploy-powerplatform-solution:
    name: Deploy Power Platform solution
    if: ${{ inputs.release-powerplatform-solution }}
    needs: build
    uses: ./.github/workflows/_template-power-platform-release.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      target-dataverse-url: ${{ vars.DATAVERSE_TARGET_URL }}

  # deploy-azure-infrastructure-legacy:
  #   name: Deploy Azure infrastructure (legacy)
  #   if: ${{ inputs.release-azure-infrastructure }}
  #   needs: build
  #   uses: ./.github/workflows/_template-azure-infrastructure-release.yml
  #   secrets: inherit  # Pass all secrets to reusable workflow
  #   with:
  #     environment: 'dev'
  #     subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy-azure-ioc-validate-plan:
    name: Validate Azure infrastructure plan
    if: ${{ inputs.release-azure-infrastructure }}
    needs: build
    uses: ./.github/workflows/_template-azure-ioc-validate-plan.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      environment: 'dev'
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      terraform-version: *terraform_version
      terraform-working-directory: *terraform_working_directory

  deploy-azure-ioc-apply:
    name: Apply Azure infrastructure plan
    if: ${{ !cancelled() && needs.build.result == 'success'&& inputs.release-azure-infrastructure && needs.deploy-azure-ioc-validate-plan.result == 'success' }}
    needs: [build, deploy-azure-ioc-validate-plan]
    uses: ./.github/workflows/_template-azure-ioc-apply.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      environment: 'dev'
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      #terraform-version: *terraform_version
      #terraform-working-directory: *terraform_working_directory

  deploy-azure-code:
    name: Deploy Azure code
    if: ${{ inputs.release-azure-code }}
    needs: [build]
    uses: ./.github/workflows/_template-azure-code-release.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      environment: 'dev'
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}