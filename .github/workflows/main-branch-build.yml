name: Main-Branch-Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual triggering
    inputs:
      release-powerplatform-solution:
        required: false
        type: boolean
        default: false
        description: 'Release Power Platform solution'
      release-azure-infrastructure:
        required: false
        type: boolean
        default: false
        description: 'Release Azure infrastructure'
      release-azure-code:
        required: false
        type: boolean
        default: false
        description: 'Release Azure code'     
        
permissions:
  contents: read  # Allows reading repository contents
  checks: write  # Allows writing test reports
  pull-requests: write  # Allows reporting results on PRs
  
jobs:
  build:
    uses: ./.github/workflows/_template-build.yml
    secrets: inherit
    with:
      node-version: '24'
      run-tests: true
      artifacts-build-upload: true
      run-sonar-analysis: true

  # Additional job that extends the base build
  deploy-powerplatform-solution:
    if: ${{ inputs.release-powerplatform-solution }}
    needs: build
    uses: ./.github/workflows/_template-power-platform-release.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      target-dataverse-url: ${{ vars.DATAVERSE_TARGET_URL }}

  deploy-azure-infrastructure-legacy:
    if: ${{ inputs.release-azure-infrastructure }}
    needs: build
    uses: ./.github/workflows/_template-azure-infrastructure-release.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      environment: 'dev'
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy-azure-infrastructure:
    if: ${{ inputs.release-azure-infrastructure }}
    needs: build
    uses: ./.github/workflows/_template-azure-infrastructure-release.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      environment: 'dev'
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy-azure-code:
    # Requires build success; if deploy-azure-infrastructure didn't run it's ignored, otherwise it must have succeeded
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.release-azure-code && (needs.deploy-azure-infrastructure-legacy.result == 'success' || needs.deploy-azure-infrastructure-legacy.result == 'skipped') }}
    needs: [build, deploy-azure-infrastructure-legacy]
    uses: ./.github/workflows/_template-azure-code-release.yml
    secrets: inherit  # Pass all secrets to reusable workflow
    with:
      environment: 'dev'
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}