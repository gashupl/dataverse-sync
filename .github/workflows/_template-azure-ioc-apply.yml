name: Azure infrastructure apply changes

on:
  workflow_call:
    inputs:      
      environment:
        required: true
        type: string
        default: 'test'
        description: 'Azure environment to deploy to (e.g. dev, test, prod)'
      subscription-id:
        required: true
        type: string
        default: ''
        description: 'Azure subscription ID to deploy to'
      terraform-version:
        required: true
        type: string
        description: 'Terraform version to install'
      terraform-working-directory:
        required: true
        type: string
        description: 'Directory containing the Terraform configuration'

permissions:
  contents: read    # Required to access repository contents

jobs:
  azure-ioc-apply:
    name: Execute
    runs-on: windows-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Azure CLI Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_SUBSCRIPTION_CONTRIBUTOR_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SUBSCRIPTION_CONTRIBUTOR_SECRET }}","tenantId":"${{ vars.AZURE_TENANT_ID }}","subscriptionId":"${{ inputs.subscription-id }}"}'

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ runner.temp }}/terraform-plan

      - name: Publish Terraform plan summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $planTextPath = Join-Path $env:RUNNER_TEMP 'terraform-plan\tfplan.txt'
          if (-not (Test-Path -LiteralPath $planTextPath)) {
            throw "Plan text file not found at '$planTextPath'."
          }

          $summary = @('## Terraform plan to be applied', '', '```text')
          $summary += Get-Content -LiteralPath $planTextPath
          $summary += '```'
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Terraform apply
        working-directory: ${{ inputs.terraform-working-directory }}
        env:
          TF_ENVIRONMENT: ${{ inputs.environment }}
          SPN_CLIENT_ID: ${{ vars.AZURE_SUBSCRIPTION_CONTRIBUTOR_CLIENT_ID }}
          SPN_CLIENT_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_CONTRIBUTOR_SECRET }}
          SPN_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:TF_IN_AUTOMATION = 'true'
          $env:ARM_CLIENT_ID = $env:SPN_CLIENT_ID
          $env:ARM_CLIENT_SECRET = $env:SPN_CLIENT_SECRET
          $env:ARM_TENANT_ID = $env:SPN_TENANT_ID
          $subscriptionId = az account show --query id -o tsv
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI failed to retrieve the active subscription ID."
          }
          if ([string]::IsNullOrWhiteSpace($subscriptionId)) {
            throw "Azure CLI returned an empty subscription ID."
          }
          $env:ARM_SUBSCRIPTION_ID = $subscriptionId.Trim()

          $planPath = Join-Path $env:RUNNER_TEMP 'terraform-plan\tfplan'
          if (-not (Test-Path -LiteralPath $planPath)) {
            throw "Terraform plan file not found at '$planPath'."
          }
          Copy-Item -LiteralPath $planPath -Destination 'tfplan' -Force

          terraform init -input=false "-backend-config=key=$env:TF_ENVIRONMENT.tfstate"
          if ($LASTEXITCODE -ne 0) {
            throw "terraform init failed with exit code $LASTEXITCODE."
          }
          terraform apply -input=false -lock-timeout=300s tfplan
          if ($LASTEXITCODE -ne 0) {
            throw "terraform apply failed with exit code $LASTEXITCODE."
          }