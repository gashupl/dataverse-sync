name: Azure infrastructure validate and plan

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        default: 'test'
        description: 'Azure environment to deploy to (e.g. dev, test, prod)'
      subscription-id:
        required: true
        type: string
        default: ''
        description: 'Azure subscription ID to deploy to'
      terraform-version:
        required: true
        type: string
        description: 'Terraform version to install'
      terraform-working-directory:
        required: true
        type: string
        description: 'Directory containing the Terraform configuration'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_SUBSCRIPTION_CONTRIBUTOR_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SUBSCRIPTION_CONTRIBUTOR_SECRET }}","tenantId":"${{ vars.AZURE_TENANT_ID }}","subscriptionId":"${{ inputs.subscription-id }}"}'

      - name: Terraform fmt and validate
        working-directory: ${{ inputs.terraform-working-directory }}
        env:
          SPN_CLIENT_ID: ${{ vars.AZURE_SUBSCRIPTION_CONTRIBUTOR_CLIENT_ID }}
          SPN_CLIENT_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_CONTRIBUTOR_SECRET }}
          SPN_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:TF_IN_AUTOMATION = 'true'
          $env:ARM_CLIENT_ID = $env:SPN_CLIENT_ID
          $env:ARM_CLIENT_SECRET = $env:SPN_CLIENT_SECRET
          $env:ARM_TENANT_ID = $env:SPN_TENANT_ID
          $subscriptionId = az account show --query id -o tsv
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI failed to retrieve the active subscription ID."
          }
          if ([string]::IsNullOrWhiteSpace($subscriptionId)) {
            throw "Azure CLI returned an empty subscription ID."
          }
          $env:ARM_SUBSCRIPTION_ID = $subscriptionId.Trim()

          terraform fmt -check -recursive
          if ($LASTEXITCODE -ne 0) {
            throw "terraform fmt failed with exit code $LASTEXITCODE."
          }
          terraform init -input=false
          if ($LASTEXITCODE -ne 0) {
            throw "terraform init failed with exit code $LASTEXITCODE."
          }
          terraform validate
          if ($LASTEXITCODE -ne 0) {
            throw "terraform validate failed with exit code $LASTEXITCODE."
          }

  plan:
    name: Plan Terraform
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_SUBSCRIPTION_CONTRIBUTOR_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SUBSCRIPTION_CONTRIBUTOR_SECRET }}","tenantId":"${{ vars.AZURE_TENANT_ID }}","subscriptionId":"${{ inputs.subscription-id }}"}'

      - name: Terraform plan
        working-directory: ${{ inputs.terraform-working-directory }}
        env:
          SPN_CLIENT_ID: ${{ vars.AZURE_SUBSCRIPTION_CONTRIBUTOR_CLIENT_ID }}
          SPN_CLIENT_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_CONTRIBUTOR_SECRET }}
          SPN_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:TF_IN_AUTOMATION = 'true'
          $env:ARM_CLIENT_ID = $env:SPN_CLIENT_ID
          $env:ARM_CLIENT_SECRET = $env:SPN_CLIENT_SECRET
          $env:ARM_TENANT_ID = $env:SPN_TENANT_ID
          $subscriptionId = az account show --query id -o tsv
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI failed to retrieve the active subscription ID."
          }
          if ([string]::IsNullOrWhiteSpace($subscriptionId)) {
            throw "Azure CLI returned an empty subscription ID."
          }
          $env:ARM_SUBSCRIPTION_ID = $subscriptionId.Trim()

          terraform init -input=false
          if ($LASTEXITCODE -ne 0) {
            throw "terraform init failed with exit code $LASTEXITCODE."
          }
          terraform plan -input=false -lock-timeout=300s -out=tfplan
          if ($LASTEXITCODE -ne 0) {
            throw "terraform plan failed with exit code $LASTEXITCODE."
          }
          terraform show -no-color tfplan > tfplan.txt
          if ($LASTEXITCODE -ne 0) {
            throw "terraform show failed with exit code $LASTEXITCODE."
          }

          $planDirectory = Join-Path $env:RUNNER_TEMP 'terraform-plan'
          New-Item -ItemType Directory -Path $planDirectory -Force | Out-Null
          Copy-Item -LiteralPath 'tfplan' -Destination (Join-Path $planDirectory 'tfplan')
          Copy-Item -LiteralPath 'tfplan.txt' -Destination (Join-Path $planDirectory 'tfplan.txt')

      - name: Publish Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ runner.temp }}/terraform-plan/